[build-system]
requires = ["setuptools>=68,<77", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "csaf-check"
version = "0.1.0"
description = "Validate CSAF 2.0 advisories from Python using the BSI csaf-validator-lib."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Gexiro Global Enterprises Ltd"}
]
keywords = ["csaf", "vex", "psirt", "advisory", "vulnerability-disclosure", "cra"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gexiro-global/csaf-check"
Repository = "https://github.com/gexiro-global/csaf-check"

[project.scripts]
csaf-check = "csaf_check.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.setuptools.packages.find]
include = ["csaf_check*"]

[tool.setuptools.package-data]
csaf_check = ["js/*.cjs", "py.typed"]
