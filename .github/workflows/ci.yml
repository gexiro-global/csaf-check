name: CI

on:
  push:
  pull_request:

jobs:
  test-without-node:
    name: Degradation path (no validator installed)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall csaf_check
      - run: python -m pytest -q

  test-with-validator:
    name: Real validation (validator installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: npm install @secvisogram/csaf-validator-lib@2.1.1
      # Build and install the actual distribution rather than an editable checkout: an editable
      # install reads straight from the source tree, so a packaging mistake - a missing data file,
      # a wrong package-data glob - would not be caught here.
      - run: python -m pip install build
      - run: python -m build
      - name: Install the built wheel into a clean venv
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install --quiet dist/*.whl
          /tmp/wheeltest/bin/csaf-check --help > /dev/null
      - name: The bundled JS bridge must survive packaging
        run: |
          test -f "$(/tmp/wheeltest/bin/python -c 'import csaf_check,os;print(os.path.join(os.path.dirname(csaf_check.__file__),"js","csaf_validate.cjs"))')"
      - name: Real validation using the installed wheel
        run: |
          set +e
          /tmp/wheeltest/bin/csaf-check examples/advisory-invalid.json --require-validator
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then echo "expected exit 1 from the wheel, got $rc"; exit 1; fi
          /tmp/wheeltest/bin/csaf-check examples/advisory-minimal.json --require-validator
      - run: python -m pip install -e ".[dev]"
      - name: A document missing mandatory fields must be rejected
        run: |
          set +e
          csaf-check examples/advisory-invalid.json --require-validator
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then echo "expected exit 1 (invalid), got $rc"; exit 1; fi
      - name: Report the verdict on the minimal example
        run: csaf-check examples/advisory-minimal.json --json
      - name: Run the suite with the validator present
        # The conclusive-verdict test is skipped when the JS dependency is absent, so this job
        # is the only place it actually executes.
        run: python -m pytest -q
